name: Build LND Mobile CGO (iOS & Android)
on:
  push:
    branches: [cshared]
  pull_request:
    branches: [cshared]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (ios, android, or both)'
        required: true
        default: 'both'
        type: choice
        options:
          - ios
          - android
          - both

jobs:
  build:
    runs-on: macos-13 # Using macOS-13 runner for Docker compatibility
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cshared
          
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"
      
      # Set up Docker on macOS using Colima
      - name: Setup Docker on macOS
        uses: douglascamata/setup-docker-macos-action@v1-alpha
        with:
          colima-additional-options: "--mount-type 9p"
            
      - name: Install build dependencies
        run: |
          brew install \
            pkg-config \
            cmake
            
      - name: Install Go dependencies
        run: |
          go mod download
          go mod verify
          
      # Create required build directories locally before running Docker commands
      - name: Create build directories
        run: |
          mkdir -p mobile/build/cgo/ios
          mkdir -p mobile/build/cgo/android

      - name: Generate mobile RPC
        run: make mobile-rpc
        
      # Setup Android NDK for Android build
      - name: Set up Android NDK
        if: github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both' || github.event_name != 'workflow_dispatch'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          
      # Make sure ndk-clang-finder.sh is executable
      - name: Make ndk-clang-finder.sh executable
        if: github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both' || github.event_name != 'workflow_dispatch'
        run: chmod +x mobile/ndk-clang-finder.sh
          
      # Build for iOS
      - name: Build iOS CGO
        if: github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both' || github.event_name != 'workflow_dispatch'
        run: |
          # Make sure clangwrap.sh is executable
          chmod +x mobile/clangwrap.sh
          
          # Set GOPATH to the current working directory
          export GOPATH=$PWD
          
          # Create src directory and link the project
          mkdir -p src/github.com/lightningnetwork
          ln -sf $PWD src/github.com/lightningnetwork/lnd
          
          # Run the iOS CGO build
          make ios-cgo
        
      - name: Archive iOS build
        if: github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both' || github.event_name != 'workflow_dispatch'
        run: |
          if [ -d "mobile/build/cgo/ios" ]; then
            cd mobile/build/cgo/ios
            zip -r ../../../../ios-cgo-build.zip .
          else
            echo "iOS build directory not found, checking alternative paths..."
            find mobile/build -type d || echo "mobile/build not found"
            echo "Creating empty archive as a fallback"
            mkdir -p empty-ios
            cd empty-ios
            echo "Build failed, see workflow logs" > README.txt
            zip -r ../ios-cgo-build.zip .
          fi
          
      - name: Upload iOS build artifact
        if: github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both' || github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ios-cgo-build
          path: ios-cgo-build.zip
          retention-days: 7
          
      # Build for Android
      - name: Build Android CGO
        if: github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both' || github.event_name != 'workflow_dispatch'
        run: |
          # Set GOPATH to the current working directory
          export GOPATH=$PWD
          
          # Create src directory and link the project (if not already done in iOS step)
          mkdir -p src/github.com/lightningnetwork
          ln -sf $PWD src/github.com/lightningnetwork/lnd
          
          # Run the Android CGO build
          make android-cgo
        
      - name: Archive Android build
        if: github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both' || github.event_name != 'workflow_dispatch'
        run: |
          if [ -d "mobile/build/cgo/android" ]; then
            cd mobile/build/cgo/android
            zip -r ../../../../android-cgo-build.zip .
          else
            echo "Android build directory not found, checking alternative paths..."
            find mobile/build -type d || echo "mobile/build not found"
            echo "Creating empty archive as a fallback"
            mkdir -p empty-android
            cd empty-android
            echo "Build failed, see workflow logs" > README.txt
            zip -r ../android-cgo-build.zip .
          fi
          
      - name: Upload Android build artifact
        if: github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both' || github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: android-cgo-build
          path: android-cgo-build.zip
          retention-days: 7
