name: Build LND Mobile CGO (iOS & Android)
on:
  push:
    branches: [cshared]
  pull_request:
    branches: [cshared]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (ios, android, or both)'
        required: true
        default: 'both'
        type: choice
        options:
          - ios
          - android
          - both

jobs:
  # First job: Generate mobile RPC on Ubuntu
  generate-mobile-rpc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cshared
          
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"
      
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3
      
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc \
            libc6-dev \
            pkg-config \
            cmake \
            make
            
      - name: Install Go dependencies
        run: |
          go mod download
          go mod verify
          
      - name: Generate mobile RPC
        run: make mobile-rpc
        
      - name: Add required header to generated file
        run: |
          # Create temporary file with header
          echo '#include <stdint.h>' > temp_header
          # Prepend header to the generated file
          cat temp_header mobile/cgo_utils_generated.go > mobile/cgo_utils_generated.go.new
          mv mobile/cgo_utils_generated.go.new mobile/cgo_utils_generated.go
      
      # Upload the entire repository with generated files
      - name: Upload repository with generated files
        uses: actions/upload-artifact@v4
        with:
          name: repo-with-mobile-rpc
          path: .
          retention-days: 1
  
  # Second job: Build for iOS and/or Android on macOS
  build:
    needs: generate-mobile-rpc
    runs-on: macos-latest
    steps:
      # Download the repository with generated RPC files
      - name: Download repository with generated files
        uses: actions/download-artifact@v4
        with:
          name: repo-with-mobile-rpc
          path: .
      
      # Restore file permissions
      - name: Restore file permissions
        run: |
          chmod -R +x .
          
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"
      
      - name: Install macOS build dependencies
        run: |
          brew install \
            pkg-config \
            cmake
            
      - name: Install Go dependencies
        run: |
          go mod download
          go mod verify

      # Setup Android NDK for Android build
      - name: Set up Android NDK
        if: github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both' || github.event_name != 'workflow_dispatch'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          
      # Make sure ndk-clang-finder.sh is executable
      - name: Make ndk-clang-finder.sh executable
        if: github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both' || github.event_name != 'workflow_dispatch'
        run: chmod +x mobile/ndk-clang-finder.sh
          
      # Build for iOS
      - name: Build iOS CGO
        if: github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both' || github.event_name != 'workflow_dispatch'
        run: |
          # Make sure clangwrap.sh is executable
          chmod +x mobile/clangwrap.sh
          
          # Run the iOS CGO build
          make ios-cgo
        
      - name: Archive iOS build
        if: github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both' || github.event_name != 'workflow_dispatch'
        run: |
          if [ -d "mobile/build/cgo/ios" ]; then
            cd mobile/build/cgo/ios
            zip -r ../../../../ios-cgo-build.zip .
          else
            echo "iOS build directory not found, checking alternative paths..."
            find mobile/build -type d
            echo "Creating empty archive as a fallback"
            mkdir -p empty-ios
            cd empty-ios
            echo "Build failed, see workflow logs" > README.txt
            zip -r ../ios-cgo-build.zip .
          fi
          
      - name: Upload iOS build artifact
        if: github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both' || github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ios-cgo-build
          path: ios-cgo-build.zip
          retention-days: 7
          
      # Build for Android
      - name: Build Android CGO
        if: github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both' || github.event_name != 'workflow_dispatch'
        run: make android-cgo
        
      - name: Archive Android build
        if: github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both' || github.event_name != 'workflow_dispatch'
        run: |
          if [ -d "mobile/build/cgo/android" ]; then
            cd mobile/build/cgo/android
            zip -r ../../../../android-cgo-build.zip .
          else
            echo "Android build directory not found, checking alternative paths..."
            find mobile/build -type d
            echo "Creating empty archive as a fallback"
            mkdir -p empty-android
            cd empty-android
            echo "Build failed, see workflow logs" > README.txt
            zip -r ../android-cgo-build.zip .
          fi
          
      - name: Upload Android build artifact
        if: github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both' || github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: android-cgo-build
          path: android-cgo-build.zip
          retention-days: 7
